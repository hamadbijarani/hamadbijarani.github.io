      return[(sh?`The ALU shifts ${h2(A)} (${A}) by one bit (${d.mnemonic}) and gets ${h2(r)} (${r}).`:isCmp?`The ALU subtracts ${h2(B)} from ${h2(A)} but throws the answer away; only the flags are kept. Carry = 1 means “no borrow”, i.e. A ≥ B.`:`The ALU combines ${h2(A)} (${A}) and ${h2(B)} (${B}) with ${d.mnemonic} and gets ${h2(r)} (${r}).`)+` The Z N C V flags are updated to ${t.flags}.`+(isCmp?" The instruction retires now.":""),`EXECUTE · ${sh?"a":"a"} ${sym} ${sh?"":"b "}→ result ${h2(r)} · flags ZNCV = ${t.flags}`]}
    if(op===12)return[`An unconditional jump: the absolute target ${h3(d.addr9)} is loaded straight into the PC. The instruction retires now.`,`EXECUTE · PC ← addr9 (${h3(d.addr9)}) · retire`];
    if(op===13){
      const cd=dv_CONDS[d.mnemonic],tk=cd[1](x.flags);
      return[`The controller checks the flags (Z N C V = ${x.flags.Z} ${x.flags.N} ${x.flags.C} ${x.flags.V}) for ${d.mnemonic}: it needs ${cd[0]}. The condition is ${tk?"TRUE, so the PC is loaded with "+h3(d.addr9)+" and the program jumps.":"FALSE, so the PC is left alone and the next instruction runs."} The instruction retires now.`,`EXECUTE · ${d.mnemonic} · branch_taken = ${tk?1:0} · retire`]}
    if(isLdi)return[`The constant ${h2(d.imm8)} (${d.imm8}) from the instruction is lined up to be written into R${d.rd}.`,`EXECUTE · wb_sel = immediate`];
    if(isLd)return[`The pointer register R${d.rs1} holds ${h2(A)}; that value will be the data-memory address.`,`EXECUTE · address = R${d.rs1}`];
    if(isSt)return[`R${d.rs1} (${h2(A)}) supplies the data-memory address and R${d.rd} (${h2(B)}) supplies the byte to store.`,`EXECUTE · address = R${d.rs1} · data = R${d.rd}`];
    if(isIn)return[`The port number ${h2(d.port)} is taken from the instruction. Next cycle the CPU raises an I/O read request.`,`EXECUTE · io_port = ${h2(d.port)}`];
    if(isOut)return[`The port number ${h2(d.port)} comes from the instruction and the byte ${h2(B)} comes from R${d.rd}. Next cycle the CPU raises an I/O write request.`,`EXECUTE · io_port = ${h2(d.port)} · io_wdata = R${d.rd}`];
  }
  if(c==="M"){
    const dv=dv_dev(d.port)[1];
    if(isSt)return[`The byte ${h2(B)} is written into data memory at address ${h2(A)}. The write is pulsed once, and the instruction retires.`,`MEM_IO · DMEM[${h2(A)}] ← ${h2(B)} · retire`];
    if(isLd)return[`Data memory is read at address ${h2(A)} and returns ${h2(x.dmem[A&255])}.`,`MEM_IO · rdata = DMEM[${h2(A)}]`];
    if(cur.wait)return[`The request is raised, but ${dv} has not said “ready” yet (waiting cycle ${cur.n} of ${cur.of}). The CPU must hold the request and its data steady. This waiting is the whole bus contract.`,`MEM_IO · ${isOut?"io_wr":"io_rd"} = 1 · io_ready = 0 · stall ${cur.n}/${cur.of}`];
    if(isOut)return[`The byte ${h2(B)} is sent to port ${h2(d.port)} (${dv}). The device raises io_ready, and because request and ready are both high the write takes effect exactly once. The instruction retires.`,`MEM_IO · io_wr && io_ready · port ${h2(d.port)} ← ${h2(B)} · retire`];
    return[`The CPU reads port ${h2(d.port)} from ${dv}. It answers with ${h2(t?t.rfData:0)} and raises io_ready.`,`MEM_IO · io_rd && io_ready · io_rdata = ${h2(t?t.rfData:0)}`]}
  if(c==="W"){
    const src=isLdi?"the constant from the instruction":isLd?"the byte read from data memory":isIn?"the byte returned by the I/O bus":"the ALU result";
    return[`The write-back multiplexer picks ${src}, ${h2(t.rfData)} (${t.rfData}), and writes it into R${t.rdAddr}. The instruction retires.`,`WRITEBACK · R${t.rdAddr} ← ${h2(t.rfData)} · retire`]}
  return["",""]
}

/* ---------- the datapath diagram (SVG string) ---------- */
function dv_diagram(p,st){
  const x=p.x,d=p.d,post=p.post,t=p.t,cur=p.path[Math.min(st,p.path.length-1)],c=cur.c,op=d.opcode;
  const isOut=op===14&&d.ioDir===1,isIn=op===14&&d.ioDir===0,isSt=op===3,isLd=op===2,isLdi=op===1,isAlu=op>=4&&op<=10,isCmp=op===11,isSh=op===9||op===10,isBr=op===12||op===13;
  const A=x.regs[d.rs1],bIdx=(isSt||isOut)?d.rd:d.rs2,B=x.regs[bIdx];
  const usesA=isAlu||isCmp||isLd||isSt,usesB=(isAlu&&!isSh)||isCmp||isSt||isOut;
  const acc=c==="M"&&!cur.wait,after=c==="W"||acc;
  const dev=op===14?dv_dev(d.port)[0]:"";
  const on={},set=(...k)=>k.forEach(z=>{if(z)on[z]=1});
  let taken=false;if(op===13&&post)taken=dv_CONDS[d.mnemonic][1](x.flags);
  if(c==="F")set("pc","imem","ir","fsm","w_pc_imem","w_imem_ir");
  else if(c==="D"){set("ir","fsm","w_sel");if(usesA)set("rowA");if(usesB)set("rowB")}
  else if(c==="E"){
    set("fsm");
    if(isAlu||isCmp)set("alu","flags","w_regA",usesB&&"w_regB","rowA",usesB&&"rowB","w_alu_flags");
    else if(op===12)set("pc","ir","w_pc_load");
    else if(op===13)set("flags","w_flags_fsm",taken&&"pc",taken&&"w_pc_load");
    else if(isLdi)set("ir","w_imm");
    else if(isLd)set("rowA","w_regA","w_memA");
    else if(isSt)set("rowA","rowB","w_memA","w_memD");
    else if(isIn)set("ir");
    else if(isOut)set("ir","rowB","w_ioW")
  }
  else if(c==="M"){
    set("fsm");
    if(isLd)set("rowA","w_memA","dmem");
    else if(isSt)set("rowA","rowB","w_memA","w_memD","dmem");
    else{set("bus","dev_"+dev,"c_"+dev);if(isOut)set("rowB","w_ioW");if(isIn&&acc)set("w_ioR")}
  }
  else if(c==="W"){
    set("fsm","wb","w_wb","rowW");
    if(isLdi)set("w_imm");else if(isLd)set("w_dmem_out","dmem");else if(isIn)set("w_ioR","bus","dev_"+dev,"c_"+dev);else set("w_alu_out","alu")
  }
  else if(c==="H")set("fsm");

  /* values to display */
  let pcShown=x.pc&511,pcNote="";

  else if(c!=="H"){pcShown=(x.pc+1)&511;if((op===12||taken)&&(c==="E"))pcShown=post.pc&511}
  const irTxt=c==="F"?"loading…":"0x"+dv_hx(p.w,4);
  const regs=(c==="W"&&t&&t.rfWe)?post.regs:x.regs;
  const fl=(post&&(c==="E"||c==="M"||c==="W"))?post.flags:x.flags;
  const nnS=(post&&after)?post.nn:x.nn;
  const leds=(post&&after)?post.leds:x.leds;
  const seg=(post&&after)?post.segValue:x.segValue;
  let aluRes="—";if(post&&c==="E"&&(isAlu||isCmp))aluRes="0x"+dv_hx(isCmp?(A-B)&255:t.rfData,2);
  const mAddr=(isLd||isSt)&&(c==="E"||c==="M")?A:null;
  const memTxt=isSt&&c==="M"?B:isLd&&c==="M"?x.dmem[A&255]:null;
  const ioActive=c==="M"&&op===14,ioW=ioActive&&isOut,ioR=ioActive&&isIn&&acc;
  const stateIdx={F:0,D:1,E:2,M:3,W:4,H:5}[c];
  const last=st>=p.path.length-1&&c!=="H";

  const T=(X,Y,s,cl="",an="")=>`<text x="${X}" y="${Y}" class="${cl}"${an?` text-anchor="${an}"`:""}>${dv_esc(s)}</text>`;
  const Bk=(k,X,Y,W,H,r=9)=>`<rect class="blk${on[k]?" on":""}" x="${X}" y="${Y}" width="${W}" height="${H}" rx="${r}"/>`;
  const wires=[];
  const Wr=(k,dd,cl="",ar)=>{wires.push({k,dd,cl,ar,on:!!on[k]})};
  const flush=()=>{let h="";[false,true].forEach(a=>wires.filter(w=>w.on===a).forEach(w=>{
    h+=`<path class="halo" d="${w.dd}"/><path class="wire ${w.cl}${w.on?" on":""}" d="${w.dd}"/>`;
    if(w.ar){const[ax,ay,dr]=w.ar,z=5,pts={r:`${ax},${ay} ${ax-z*1.6},${ay-z} ${ax-z*1.6},${ay+z}`,l:`${ax},${ay} ${ax+z*1.6},${ay-z} ${ax+z*1.6},${ay+z}`,d:`${ax},${ay} ${ax-z},${ay-z*1.6} ${ax+z},${ay-z*1.6}`,u:`${ax},${ay} ${ax-z},${ay+z*1.6} ${ax+z},${ay+z*1.6}`}[dr];
      h+=`<polygon class="ah ${w.cl}${w.on?" on":""}" points="${pts}"/>`}}));return h};
  /* wires (arrow = [x, y, direction]) */
  Wr("w_pc_imem","M124,53 H166","",[166,53,"r"]);
  Wr("w_imem_ir","M336,53 H378","",[378,53,"r"]);
  Wr("w_ir_fsm","M586,53 H628","",[628,53,"r"]);
  Wr("w_pc_load","M470,84 V98 H74 V84","ctl",[74,84,"u"]);
  Wr("w_sel","M520,84 V112 H144 V148","ctl",[144,148,"d"]);

  Wr("w_dmem_out","M680,248 V398","res",[680,398,"d"]);
  Wr("w_ioR","M720,458 V422","res",[720,422,"u"]);
  Wr("w_wb","M144,398 V382","res",[144,382,"u"]);
  [["sw",94],["led",260],["seg",410],["per",540],["nn",800]].forEach(([k,X])=>Wr("c_"+k,`M${X},486 V512`,"io",[X,512,"d"]));
  let o=`<svg viewBox="0 0 1000 650" class="dsv-svg" role="img" aria-label="DSD-8 datapath, highlighted for the current clock cycle">`;
  o+=`<rect class="pnl" x="8" y="8" width="984" height="120" rx="14"/><rect class="pnl" x="8" y="136" width="984" height="298" rx="14"/><rect class="pnl" x="8" y="446" width="984" height="196" rx="14"/>`;
  o+=T(20,124,"FETCH + CONTROL","pt")+T(984,428,"DATAPATH","pt","end")+T(984,636,"MEMORY + I/O","pt","end");
  o+=flush();
  /* wire labels */
  o+=T(250,95,"branch / jump target (addr9)","wl")+T(330,109,"register select (rs1 · rs2 · rd)","wl")+T(628,101,"flags → branch decision","wl","end");
  o+=T(396,130,"A → memory address","wl","end")+T(326,384,"B → store / OUT data","wl")+T(531,160,"imm8","wl","end")+T(496,300,"ALU result","wl","end");
  /* top row */
  o+=Bk("pc",24,22,100,62)+T(74,40,"Program counter","lbl","middle")+T(74,64,"0x"+dv_hx(pcShown,3),"val","middle")+T(74,78,pcNote,"sub","middle");
  o+=Bk("imem",166,22,170,62)+T(251,40,"Instruction memory 512×16","lbl","middle")+T(251,63,"["+dv_hx(x.pc&511,3)+"] = 0x"+dv_hx(p.w,4),"val sm","middle")+T(251,78,"address = PC","sub","middle");
  o+=Bk("ir",378,22,208,62)+T(482,38,"Instruction register + decoder","lbl","middle")+T(482,58,c==="F"?irTxt:d.syntax,"val sm","middle")+T(482,72,c==="F"?"":"IR 0x"+dv_hx(p.w,4)+" · op "+op,"sub","middle");
  o+=Bk("fsm",628,22,352,62)+T(642,40,"Control unit · 6-state FSM","lbl")+T(966,40,"cycle "+(x.cycleCount+(c==="H"?0:st)),"sub","end");
  ["FETCH","DECODE","EXEC","MEM/IO","WRITE","HALT"].forEach((nm,i)=>{o+=`<rect class="chip${stateIdx===i?" on":""}" x="${640+i*56}" y="48" width="52" height="24" rx="6"/>`+T(640+i*56+26,64,nm,"chipt","middle")});
  if(last)o+=T(966,80,"✓ retires","sub ok","end");
  /* register file */
  o+=Bk("rf",24,148,240,234)+T(36,166,"Register file · 8 × 8-bit","lbl");
  for(let i=0;i<8;i++){
    const ra=on.rowA&&i===d.rs1,rb=on.rowB&&i===bIdx,rw=on.rowW&&t&&i===t.rdAddr,Y=174+i*25;

    const tag=rw?"write":(ra&&rb?"A + B":ra?"read A":rb?"read B":"");if(tag)o+=T(248,Y+15,tag,"tag","end")

  /* data memory */
  o+=Bk("dmem",590,148,180,100)+T(680,166,"Data memory · 256 × 8","lbl","middle")+T(602,192,"address","sub")+T(758,192,mAddr==null?"—":"0x"+dv_hx(mAddr,2),"mono","end")+T(602,214,isSt?"data in":"data out","sub")+T(758,214,memTxt==null?"—":"0x"+dv_hx(memTxt,2),"mono","end")+T(602,238,"register-indirect: [Rn]","sub");

  /* devices */
  o+=Bk("dev_sw",24,512,140,124)+T(94,530,"Switches · buttons","lbl","middle")+T(94,556,"0x"+dv_hx(x.switches,2),"val","middle")+T(94,571,"switches · port 0x00","sub","middle")+T(94,598,"0x"+dv_hx(x.buttons,2),"val sm","middle")+T(94,613,"buttons · port 0x01","sub","middle");
  o+=Bk("dev_led",175,512,170,124)+T(260,530,"LEDs · port 0x02","lbl","middle");

  o+=Bk("dev_per",475,512,130,124)+T(540,530,"UART · timer · echo","lbl","middle")+T(540,564,"UART sent: "+x.uartTxLog.length,"mono","middle")+T(540,584,"timer: "+(x.timerCount&255),"mono","middle")+T(540,606,"ports 0x20 – 0x40","sub","middle");
  /* NN accelerator with its internal flow */
  const mp=cur.wait&&op===14&&d.port===81?cur.n:0;
  o+=Bk("dev_nn",620,512,360,124)+T(632,530,"Neural-network accelerator · 0x50 – 0x5F","lbl")+`<rect class="chip${nnS.unlocked?" on":""}" x="905" y="518" width="65" height="18" rx="5"/>`+T(937,531,nnS.unlocked?"unlocked":"locked","chipt","middle");
  const ln=(dd,ar)=>`<path class="nl" d="${dd}"/>`;
  o+=`<rect class="mini" x="632" y="540" width="44" height="24" rx="5"/>`+T(654,556,"A = "+dv_hx(nnS.regA&255,2),"sub","middle");
  o+=`<rect class="mini" x="632" y="568" width="44" height="24" rx="5"/>`+T(654,584,"W (write)","sub","middle");
  o+=ln("M676,552 H698 V562 H716")+ln("M676,580 H698 V570 H716");
  o+=`<circle class="mini" cx="729" cy="566" r="12"/>`+T(729,571,"×","val sm","middle")+ln("M741,566 H772");
  [1,2,3].forEach((n,i)=>{o+=`<rect class="chip${mp===n?" on":""}" x="${774+i*38}" y="553" width="34" height="26" rx="5"/>`+T(791+i*38,570,"S"+n,"chipt","middle")});
  o+=ln("M888,566 H906")+`<rect class="mini" x="906" y="540" width="64" height="50" rx="5"/>`+T(938,557,"ACC 24-bit","sub","middle")+T(938,577,String(nnS.acc),"mono","middle");
  o+=ln("M938,590 V602")+`<rect class="mini" x="858" y="602" width="112" height="28" rx="5"/>`+T(914,614,"shift→sat8→LUT","sub","middle")+T(914,626,"act = "+Id(nnS.acc,nnS.shift,nnS.lutSel),"mono","middle");
  o+=`<rect class="mini" x="744" y="602" width="104" height="28" rx="5"/>`+T(796,614,"shift "+nnS.shift+" · bank "+nnS.lutSel,"sub","middle")+T(796,626,"set via 0x56 / 0x58","sub","middle")+ln("M848,616 H858");
  o+=`<rect class="mini" x="632" y="602" width="104" height="28" rx="5"/>`+T(684,614,"MACs run: "+nnS.macCnt,"sub","middle")+T(684,626,"skipped: "+nnS.skipCnt,"sub","middle");
  return o+"</svg>"
}

function DvDiagram(p){
  const{plan,st}=p.c;
  if(!plan)return s.jsx("div",{className:"card text-sm text-slate-600",children:"Fix the error in the program to see the diagram."});
  return s.jsxs("div",{children:[
    s.jsx("div",{className:"dsv-scroll",children:s.jsx("div",{dangerouslySetInnerHTML:{__html:dv_diagram(plan,st)}})}),
    s.jsxs("div",{className:"dsv-legend",children:[
      s.jsxs("span",{children:[s.jsx("i",{className:"sw-d"}),"data / operands"]}),
      s.jsxs("span",{children:[s.jsx("i",{className:"sw-r"}),"result going back to a register"]}),
      s.jsxs("span",{children:[s.jsx("i",{className:"sw-i"}),"memory and I/O traffic"]}),
      s.jsxs("span",{children:[s.jsx("i",{className:"sw-c"}),"control: branch / register select"]}),
      s.jsx("span",{className:"ml-auto",children:"Moving dashes show which way data flows in the current clock cycle."})
    ]})
  ]})
}

function DvNarr(p){
  const{x,S,plan,st,setSt,cyc,step,V}=p.c;
  if(V==="wave")return s.jsxs("div",{className:"card text-sm leading-relaxed text-slate-600",children:[
    s.jsx("div",{className:"label",children:"How to read the waveform"}),
    s.jsxs("p",{className:"mt-2",children:["Every column is one clock cycle. Press ",s.jsx("b",{children:"Step"}),", ",s.jsx("b",{children:"Play"})," or ",s.jsx("b",{children:"Run to end"})," on the left and the trace grows to the right. The top row names the instruction that owns each stretch of cycles."]}),
    s.jsxs("p",{className:"mt-2",children:["Look for the pattern ",s.jsx("b",{children:"FETCH → DECODE → EXECUTE → WRITEBACK"})," in the ",s.jsx("code",{children:"state"})," row, a one-cycle ",s.jsx("code",{children:"retire"})," pulse at the end of every instruction, and ",s.jsx("code",{children:"io_wr"})," held high until ",s.jsx("code",{children:"io_ready"})," answers. For an accelerator write, ",s.jsx("code",{children:"pipe_valid"})," walks through its three stages before ",s.jsx("code",{children:"acc"})," changes."]}),
    s.jsxs("p",{className:"mt-2 text-xs text-slate-500",children:["Move the mouse over the chart to read any cycle. Use the download button to open this trace in GTKWave."]})
  ]});
  if(!plan)return s.jsx("div",{className:"card text-sm text-slate-600",children:"Fix the error in the program (see the red message on the left) to see how it executes."});
  const cur=plan.path[Math.min(st,plan.path.length-1)],say=dv_say(plan,st),h=x.halted;
  return s.jsxs("div",{className:"card",children:[

/* ---------- waveform: expand retired instructions into clock cycles ---------- */
function dv_expand(evs){
  const C=[];let prevIr=0,leds=0,acc=0,un=0,mc=0,sc=0,fl=0,prod=0;
  const base=()=>({r:0,s:0,p:0,i:prevIr,d:"reset",rt:0,we:0,ra:0,rv:0,f:fl,mw:0,ior:0,iow:0,rdy:0,pt:0,wd:0,rdt:0,un,ms:0,bz:0,pv:0,pr:prod,ac:acc,mc,sc,ld:leds,h:0});
  for(let i=0;i<2;i++)C.push(base());
  const code={F:0,D:1,E:2,M:3,W:4};
  evs.forEach((e,ei)=>{
    const seq=[],nx=evs[ei+1]?evs[ei+1].pc:(e.pc+1)&511;
    const sq=e.op===0||e.op===15?"FD":(e.op>=11&&e.op<=13)?"FDE":(e.op===3||(e.io&&e.out))?"FDEM":(e.op===2||(e.io&&!e.out))?"FDEMW":"FDEW";
    for(const ch of sq){if(ch==="M")for(let k=0;k<e.stall;k++)seq.push({c:ch,w:1,n:k});seq.push({c:ch,w:0})}
    const eIdx=seq.findIndex(q=>q.c==="E"),aIdx=seq.findIndex(q=>q.c==="M"&&!q.w);
    const macOn=e.op===14&&e.out&&e.port===81&&e.mac&&e.stall>0,jump=e.op===12||e.op===13;
    seq.forEach((q,j)=>{
      const o=base(),last=j===seq.length-1,after=aIdx>=0&&j>=aIdx;
      o.r=1;o.s=code[q.c];o.d=e.mn;
      o.p=q.c==="F"?e.pc:((jump&&eIdx>=0&&j>eIdx)?nx:(e.pc+1)&511);
      if(q.c!=="F")o.i=e.ir;
      o.rt=last?1:0;o.we=last&&e.we?1:0;o.ra=last&&e.we?e.ra:0;o.rv=last&&e.we?e.rv:0;
      o.f=(eIdx>=0&&j>eIdx)?e.nf:fl;
      if(q.c==="M"){
        if(e.op===3&&!q.w)o.mw=1;
        if(e.io){o.ior=e.out?0:1;o.iow=e.out?1:0;o.pt=e.port;o.wd=e.out?e.wd:0;o.rdy=q.w?0:1;o.rdt=(!e.out&&!q.w)?e.rdt:0}
      }
      o.un=(aIdx>=0&&j>aIdx)?e.un1:e.un0;
      if(macOn&&q.c==="M"&&q.w){o.ms=q.n===0?1:0;o.bz=1;o.pv=1<<q.n;if(q.n>=1)o.pr=e.prod}
      o.ac=after?e.ac1:e.ac0;
      o.mc=after?e.mc:mc;o.sc=after?e.sc:sc;
      if(after&&e.mac)o.pr=e.prod;
      o.ld=after?e.ld:leds;
      if(aIdx<0&&last){o.ld=e.ld;o.mc=e.mc;o.sc=e.sc;o.ac=e.ac1;o.un=e.un1}
      C.push(o)
    });
    const L=C[C.length-1];
    prevIr=e.ir;leds=e.ld;acc=e.ac1;un=e.un1;mc=e.mc;sc=e.sc;fl=e.nf;prod=L.pr;
    if(e.h){const o=base();o.r=1;o.s=5;o.d="halted";o.h=1;o.p=(e.pc+1)&511;o.i=e.ir;C.push(o)}
  });
  return C
}

const cn_K=[
  {n:"Horizontal line",sy:"─",k:[[-1,-1,-1],[2,2,2],[-1,-1,-1]]},
  {n:"Vertical line",sy:"│",k:[[-1,2,-1],[-1,2,-1],[-1,2,-1]]},

const cn_SH1=3,cn_SH2=3;

function cn_pre(name){
  const a=Array(64).fill(0),set=(r,c)=>{if(r>=0&&r<8&&c>=0&&c<8)a[r*8+c]=127};
  if(name==="h"){const r=2+Math.floor(Math.random()*4);for(let c=0;c<8;c++)set(r,c)}
  if(name==="v"){const c=2+Math.floor(Math.random()*4);for(let r=0;r<8;r++)set(r,c)}
  if(name==="d"){const o=Math.floor(Math.random()*3)-1;for(let i=0;i<8;i++)set(i,i+o)}
  if(name==="a"){const o=Math.floor(Math.random()*3)-1;for(let i=0;i<8;i++)set(i,7-i+o)}

}
function cn_taps(img,k,r,c){

  for(let i=0;i<3;i++)for(let j=0;j<3;j++){const px=img[(r+i)*8+c+j],w=kk[i][j],skip=px===0||w===0;taps.push({px,w,skip,prod:px*w});if(!skip)acc+=px*w}

  return{taps,acc,raw,act:Math.max(0,raw),ex:taps.filter(t=>!t.skip).length,sk:taps.filter(t=>t.skip).length+1}
}

const XA_FAQ=`<div class="xf">${[
 ["In one sentence, what is this project?","We designed an 8-bit processor (DSD-8) from scratch in Verilog, attached a small neural-network accelerator to its I/O bus, and proved, with an independent Python model, that it correctly classifies Iris flowers 39.7× faster and 8×8 digit images 20.8× faster than software on the same processor."],
 ["Why put the accelerator on the I/O bus instead of adding a MUL instruction?","All 16 opcodes are already used, and a new instruction would change the assembler, decoder, control unit and the conformance traces. Using the existing IN and OUT instructions keeps the instruction set unchanged, so every old program still behaves exactly the same. The lock key (0xA5) keeps the accelerator switched off until a program asks for it."],
 ["What does “8-bit” mean, and how are negative numbers stored?","Every register, the ALU and every memory location hold one byte: 0 to 255. Negative numbers use two’s complement: −1 is 0xFF, −2 is 0xFE, −128 is 0x80. The assembler only accepts 0–255, so the program generator writes negative weights as their byte value."],
 ["What is int8 quantization, and did it cost accuracy?","Training produces decimal weights. We round them to whole numbers between −127 and 127 and pick power-of-two shifts so the results stay in range. On the 23 shipped test flowers both the float and int8 models get 22 right (95.65%). Caveat: the same 23 flowers were used to choose the shifts, so this is the accuracy of the shipped model, not an independent estimate."],
 ["What is zero skipping?","Anything times zero is zero, so if the input or the weight is 0 the accelerator does not start a multiply at all; it only counts it in SKIPCNT (port 0x5C). After ReLU many values are 0, and many image pixels are 0, so this saves work."],
 ["Why is the accumulator 24 bits?","Each product of two int8 numbers needs up to 16 bits, and a neuron adds many of them. 24 bits gives plenty of head-room. If it ever overflows it wraps around exactly like the Python reference, so both always agree."],
 ["What are “retire” and “trace”?","An instruction retires when it has completely finished. At that moment one trace line is written: address, instruction, which register or memory byte changed and the flags. Comparing traces from Python and Verilog checks the processor instruction by instruction."],
 ["How do you know the Verilog is right and not just the tests?","Four independent layers: lint, 13 unit testbenches (with random vectors), whole-program trace comparison against a separately written Python model, and 486 end-to-end network runs that must match the trace, obey the bus rules and light the reference answer on the LEDs."],
 ["Why is a4 so much faster than a2?","a4 is “unrolled”: every weight is written directly into the program, so there are no loops, pointers or branches. a2 still loops over weights stored in memory. The hardware does the same maths in both; the difference is loop overhead."],
 ["Why did posted mode give no speed-up?","Posted mode lets the CPU continue right after writing a weight. But our programs read the result right after the writes, so the waiting just moves from the write to the read. Issuing independent multiplies before reading would be needed (future work)."],
 ["Why is the CNN speed-up (20.8×) smaller than Iris (39.7×)?","In the convolution loop a lot of time goes into pointer arithmetic and reading bytes from the stream device. The accelerator removes the multiply loops, but not that bookkeeping. It still retires about 24× fewer instructions (13,696 vs 332,617)."],
 ["Did you run it on a real FPGA board?","No. The design is written to be synthesizable and dsd8_top.v is the top level, but we did not include board pin constraints, a clock wrapper or a bitstream, and we report no area, clock-speed or power numbers. All results are from cycle-accurate simulation."],
 ["Is the CNN stream device real hardware?","No, it is a simulation-only peripheral (sim/cnn_periph.v, ports 0x44–0x46). Importantly, nothing under rtl/ was changed for the CNN: the CPU and accelerator are exactly the ones used for Iris."],
 ["How long does one instruction take?","2 clock cycles for NOP/HLT, 3 for CMP, jump and branch, 4 for ALU, shift, LDI and ST, 5 for LD; OUT takes 4 and IN 5, plus any time spent waiting for the device to be ready."],
 ["What would you do next?","Put it on an FPGA board with constraints and real peripherals, measure area, clock speed and power, add a small queue or several accumulators so multiplies can overlap, and try larger datasets."]
].map(([q,a],i)=>`<details class="xf-q"${i===0?" open":""}><summary><span class="xf-n">${i+1}</span>${q}</summary><p>${a}</p></details>`).join("")}</div>`;

/* DSD-8 visual simulator add-on */
.dsv-tabs{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.1rem}
.dsv-tab{flex:1 1 210px;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:.9rem;padding:.7rem .95rem;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s}
.dsv-tab b{display:block;font-size:.92rem;color:#0f172a}
.dsv-tab span{font-size:.76rem;color:#64748b}
.dsv-tab:hover{border-color:#a5b4fc}
.dsv-tab.on{border-color:#4f46e5;background:#eef2ff;box-shadow:0 0 0 2px #c7d2fe}
.dsv-split{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){.dsv-split{grid-template-columns:repeat(5,minmax(0,1fr))}.dsv-l{grid-column:span 2}.dsv-r{grid-column:span 3}}
.dsv-l,.dsv-r{min-width:0}
.dsv-full{grid-column:1/-1;min-width:0}
.dsv-scroll,.dsv-wscroll{overflow-x:auto;border:1px solid #e2e8f0;border-radius:1rem;background:#fff}
.dsv-svg{display:block;width:100%;min-width:860px;height:auto}
.dsv-svg .blk{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;transition:fill .2s,stroke .2s}
.dsv-svg .blk.on{fill:#eef2ff;stroke:#4f46e5;stroke-width:2.2}
.dsv-svg .mini{fill:#f8fafc;stroke:#e2e8f0}
.dsv-svg .row{fill:#f8fafc;stroke:#e2e8f0}
.dsv-svg .row.ra{fill:#e0e7ff;stroke:#4f46e5}
.dsv-svg .row.rb{fill:#fef3c7;stroke:#d97706}
.dsv-svg .row.rw{fill:#d1fae5;stroke:#059669}
.dsv-svg .chip{fill:#f1f5f9;stroke:#e2e8f0}
.dsv-svg .chip.on{fill:#4f46e5;stroke:#4338ca}
.dsv-svg .chip.on+.chipt{fill:#fff}
.dsv-svg .led{fill:#e2e8f0}
.dsv-svg .led.lit{fill:#fbbf24;filter:drop-shadow(0 0 4px rgba(251,191,36,.9))}
.dsv-svg .pnl{fill:#f8fafc;stroke:#eef2f7}
.dsv-svg .pt{font:700 9.5px Inter,sans-serif;fill:#cbd5e1;letter-spacing:.12em}
.dsv-svg .wl{font-size:9.5px;font-style:italic;fill:#94a3b8}
.dsv-svg .halo{fill:none;stroke:#f8fafc;stroke-width:7}
.dsv-svg .nl{fill:none;stroke:#cbd5e1;stroke-width:1.5}
.dsv-svg .ah{fill:#cbd5e1}.dsv-svg .ah.ctl{fill:#e2e8f0}
.dsv-svg .ah.on{fill:#4f46e5}.dsv-svg .ah.res.on{fill:#059669}.dsv-svg .ah.io.on{fill:#d97706}.dsv-svg .ah.ctl.on{fill:#db2777}
.dsv-svg .wire{fill:none;stroke:#cbd5e1;stroke-width:1.8;stroke-linejoin:round}
.dsv-svg .wire.ctl{stroke:#e2e8f0;stroke-dasharray:3 4}
.dsv-svg .wire.on{stroke:#4f46e5;stroke-width:2.8;stroke-dasharray:8 5;animation:dsvflow .6s linear infinite}
.dsv-svg .wire.res.on{stroke:#059669}
.dsv-svg .wire.io.on{stroke:#d97706}
.dsv-svg .wire.ctl.on{stroke:#db2777}
@keyframes dsvflow{to{stroke-dashoffset:-26}}
@media(prefers-reduced-motion:reduce){.dsv-svg .wire.on{animation:none}}
.dsv-svg text{font-family:Inter,system-ui,sans-serif}
.dsv-svg .lbl{font-size:11.5px;font-weight:600;fill:#475569}
.dsv-svg .val{font:600 15px 'JetBrains Mono',ui-monospace,monospace;fill:#0f172a}
.dsv-svg .val.sm{font-size:12.5px}
.dsv-svg .mono{font:500 11.5px 'JetBrains Mono',ui-monospace,monospace;fill:#0f172a}
.dsv-svg .sub{font-size:10.5px;fill:#64748b}
.dsv-svg .sub.ok{fill:#059669;font-weight:600}
.dsv-svg .tag{font-size:10px;font-weight:600;fill:#4f46e5}
.dsv-svg .chipt{font-size:9.5px;font-weight:600;fill:#475569}
.dsv-legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;align-items:center;margin-top:.6rem;font-size:.75rem;color:#64748b}
.dsv-legend i{display:inline-block;width:1.4rem;height:0;border-top:3px solid;margin-right:.35rem;vertical-align:middle}
.sw-d{border-color:#4f46e5!important}.sw-r{border-color:#059669!important}.sw-i{border-color:#d97706!important}.sw-c{border-color:#db2777!important;border-top-style:dashed!important}
.dsv-path{display:flex;gap:.35rem;margin-top:.7rem;flex-wrap:wrap}
.dsv-pip{min-width:2rem;height:2rem;padding:0 .4rem;border-radius:.5rem;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font:600 .78rem 'JetBrains Mono',ui-monospace,monospace;cursor:pointer}
.dsv-pip.done{background:#e0e7ff;border-color:#a5b4fc;color:#4338ca}
.dsv-pip.on{background:#4f46e5;border-color:#4338ca;color:#fff}
.dsv-wbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.dsv-sep{width:1px;height:1.4rem;background:#e2e8f0;margin:0 .3rem}
.dsv-chk{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;color:#475569;cursor:pointer}
.dsv-range{flex:1;min-width:140px;accent-color:#4f46e5}
.dsv-wwrap{position:relative;min-width:900px}
.dsv-wsvg{display:block;width:100%;height:auto}
.dsv-cur{position:absolute;top:0;bottom:0;background:rgba(79,70,229,.12);pointer-events:none;border-left:1px solid rgba(79,70,229,.5);border-right:1px solid rgba(79,70,229,.5)}
.dsv-wsvg .wg{stroke:#f1f5f9}.dsv-wsvg .wg.m{stroke:#e2e8f0}
.dsv-wsvg .wax{font:500 10px 'JetBrains Mono',ui-monospace,monospace;fill:#94a3b8}
.dsv-wsvg .wgh{fill:#f1f5f9}.dsv-wsvg .wgt{font:700 10.5px Inter,sans-serif;fill:#475569;letter-spacing:.04em}
.dsv-wsvg .wn{font:500 11px 'JetBrains Mono',ui-monospace,monospace;fill:#334155}
.dsv-wsvg .wv{font:500 10.5px 'JetBrains Mono',ui-monospace,monospace;fill:#0f172a}
.dsv-wsvg .wl{fill:none;stroke-width:1.8;stroke-linejoin:miter}
.dsv-wsvg .wl.c{stroke:#94a3b8}
.dsv-wsvg .wl.sys{stroke:#475569}.dsv-wsvg .wl.cpu{stroke:#4f46e5}.dsv-wsvg .wl.io{stroke:#d97706}.dsv-wsvg .wl.nn{stroke:#059669}
.dsv-wsvg .wf{opacity:.12}
.dsv-wsvg .wf.sys{fill:#475569}.dsv-wsvg .wf.cpu{fill:#4f46e5}.dsv-wsvg .wf.io{fill:#d97706}.dsv-wsvg .wf.nn{fill:#059669}
.dsv-wsvg .wb{stroke-width:1.2}
.dsv-wsvg .wb.sys{fill:#f1f5f9;stroke:#64748b}.dsv-wsvg .wb.cpu{fill:#eef2ff;stroke:#818cf8}.dsv-wsvg .wb.io{fill:#fffbeb;stroke:#f59e0b}.dsv-wsvg .wb.nn{fill:#ecfdf5;stroke:#34d399}
.dsv-wsvg .wb.z{fill:#fff;stroke:#cbd5e1}
.dsv-wsvg .wb.s0{fill:#e0e7ff}.dsv-wsvg .wb.s1{fill:#ede9fe}.dsv-wsvg .wb.s2{fill:#dbeafe}.dsv-wsvg .wb.s3{fill:#fef3c7}.dsv-wsvg .wb.s4{fill:#d1fae5}.dsv-wsvg .wb.s5{fill:#fee2e2}

.dsv-fsbar{display:flex;justify-content:flex-end;margin:-1.2rem 0 .8rem}
#try.dsv-fs{position:fixed;inset:0;z-index:100;overflow:hidden;background:#fff;padding:0!important}
#try.dsv-fs>div{max-width:none!important;margin:0!important;padding:14px!important;box-sizing:border-box}
#try.dsv-fs>div>div.mb-8{display:none}
#try.dsv-fs .dsv-fsbar{position:absolute;top:14px;right:14px;margin:0;z-index:2}
#try.dsv-fs .dsv-tabs{padding-right:170px;margin-bottom:.7rem;gap:.5rem}
#try.dsv-fs .dsv-tab{padding:.4rem .85rem;flex:1 1 180px}
#try.dsv-fs .dsv-tab span{display:none}
#try.dsv-fs .dsv-split{grid-template-columns:400px minmax(0,1fr)!important;gap:1rem}
#try.dsv-fs .dsv-l{grid-column:1;grid-row:1/span 2}
#try.dsv-fs .dsv-r,#try.dsv-fs .dsv-full{grid-column:2}
#try.dsv-fs .dsv-r .card{padding:.8rem 1rem}#try.dsv-fs .dsv-r .card>p.text-xs,#try.dsv-fs .dsv-legend .ml-auto{display:none}
#try.dsv-fs .dsv-r .card .mt-3{margin-top:.5rem}
#try.dsv-fs .dsv-svg,#try.dsv-fs .dsv-wwrap{min-width:0}#try.dsv-fs .dsv-scroll,#try.dsv-fs .dsv-wscroll{overflow:hidden}

/* CNN section */
.cn-sp{flex:1}
.cn-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:.5rem}
.cn-flow>i{align-self:center;color:#94a3b8;font-style:normal;font-size:1.2rem}
.cn-step{flex:1 1 150px;display:flex;flex-direction:column;gap:.2rem;border:1px solid #e2e8f0;background:#fff;border-radius:.9rem;padding:.7rem .85rem}
.cn-step b{font-size:.9rem;color:#0f172a}.cn-step span{font-size:.75rem;color:#64748b;line-height:1.35}
.cn-step em{margin-top:auto;align-self:flex-start;font-style:normal;font-size:.68rem;font-weight:600;color:#4338ca;background:#e0e7ff;border-radius:999px;padding:.1rem .5rem}
.cn-step.hw{border-color:#a5b4fc;background:#eef2ff}
.cn-wrap{display:grid;gap:1.25rem;margin-top:1rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.cn-wrap{grid-template-columns:290px minmax(0,1fr)}}
.cn-pix{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(100%,280px);touch-action:none;user-select:none;padding:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.8rem}
.cn-pix i{aspect-ratio:1;display:block;border-radius:4px;background:#e2e8f0;cursor:pointer}
.cn-pix i.on{background:#1e1b4b}
.cn-maps{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.cn-fm{border:1px solid #e2e8f0;border-radius:.9rem;padding:.7rem;background:#fff}
.cn-fmt{font-size:.78rem;font-weight:600;color:#334155;margin-bottom:.4rem}
.cn-row{display:flex;align-items:center;gap:.5rem}
.cn-arrow{color:#94a3b8}
.cn-k{display:grid;grid-template-columns:repeat(3,1.15rem);gap:2px;font:600 .7rem 'JetBrains Mono',ui-monospace,monospace}
.cn-k b{display:block;text-align:center;border-radius:3px;background:#e0e7ff;color:#3730a3;padding:.12rem 0}
.cn-k b.neg{background:#fee2e2;color:#991b1b}.cn-k b.z{background:#f1f5f9;color:#94a3b8}
.cn-heat{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;flex:1;min-width:0;max-width:84px}
.cn-heat i{aspect-ratio:1;display:block}
.cn-pl{font-size:.7rem;color:#64748b;margin-top:.5rem}
.cn-pool{display:grid;grid-template-columns:repeat(3,2.1rem);gap:2px;margin-top:.25rem;font:600 .68rem 'JetBrains Mono',ui-monospace,monospace}
.cn-pool span{text-align:center;border-radius:3px;background:#eef2ff;color:#3730a3;padding:.18rem 0}.cn-pool span.z{background:#f1f5f9;color:#94a3b8}
.cn-stat{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;margin-top:1rem;border-radius:.9rem;background:#0f172a;color:#e2e8f0;padding:.75rem 1rem;font-size:.85rem}
.cn-stat b{color:#a5b4fc}
.cn-note{margin-top:1rem;border-radius:.9rem;background:#f8fafc;border:1px solid #e2e8f0;padding:.8rem 1rem;font-size:.82rem;line-height:1.55;color:#475569}
/* CNN walk-through v2 */
.cn-demo .cn-wrap{grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.cn-demo .cn-wrap{grid-template-columns:300px minmax(0,1fr)}}
.cn-stages{display:flex;flex-wrap:wrap;gap:.4rem;align-items:stretch}
.cn-stg{display:flex;align-items:center;gap:.45rem;border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:.35rem .8rem .35rem .4rem;cursor:pointer;font-size:.82rem;color:#475569}
.cn-stg b{display:inline-flex;width:1.4rem;height:1.4rem;border-radius:50%;background:#f1f5f9;align-items:center;justify-content:center;font-size:.72rem}
.cn-stg.done b{background:#e0e7ff;color:#4338ca}.cn-stg.on{border-color:#4f46e5;background:#eef2ff;color:#1e1b4b;font-weight:600;box-shadow:0 0 0 2px #c7d2fe}.cn-stg.on b{background:#4f46e5;color:#fff}
.cn-play{margin-left:auto}
.cn-desc{margin:.7rem 0 0;font-size:.9rem;color:#334155;min-height:2.6rem}

/* ================= DSD-8 design refresh + explainer sections ================= */
:root{--xa-ink:#0b1026;--xa-ind:#4f46e5;--xa-grn:#059669;--xa-amb:#d97706;--xa-pnk:#db2777}
html{scroll-behavior:smooth}
body{counter-reset:xach;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* nav */
nav.xa-nav{background:rgba(11,16,38,.92)!important;border-color:rgba(255,255,255,.08)!important}
nav.xa-nav a{color:#c7d2fe!important;border-radius:999px;padding:.28rem .7rem;transition:background .2s,color .2s}
nav.xa-nav a:first-child{color:#fff!important;letter-spacing:.02em;padding-left:0}
nav.xa-nav a:hover{color:#fff!important;background:rgba(255,255,255,.08)}
nav.xa-nav a.xa-on{background:#4f46e5;color:#fff!important}
nav.xa-nav>div{gap:.2rem!important;scrollbar-width:none}
nav.xa-nav>div::-webkit-scrollbar{display:none}
.xa-prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#818cf8,#34d399,#fbbf24);transform-origin:0 50%;transform:scaleX(0)}

/* hero */
header#top{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,rgba(99,102,241,.35),transparent 60%),radial-gradient(800px 400px at -10% 110%,rgba(16,185,129,.18),transparent 60%),linear-gradient(180deg,#0b1026,#151a3d)!important}
header#top:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
header#top>div{position:relative}
header#top h1{color:#fff!important;letter-spacing:-.02em}
header#top p{color:#c7d2fe!important}
header#top p strong{color:#fff!important}
header#top .text-indigo-600{color:#a5b4fc!important}
header#top .rounded-2xl.border{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.12)!important;box-shadow:none!important;backdrop-filter:blur(4px);transition:transform .2s,border-color .2s}
header#top .rounded-2xl.border:hover{transform:translateY(-2px);border-color:rgba(165,180,252,.5)!important}
header#top .rounded-2xl.border .text-indigo-700{color:#a5b4fc!important}
header#top .rounded-2xl.border .text-slate-900{color:#fff!important}
header#top .rounded-2xl.border .text-slate-500{color:#94a3b8!important}

/* sections: chapter numbers + softer cards */
